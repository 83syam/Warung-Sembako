<!DOCTYPE html>

<head>

<title>Warung Sembako 2 - Syamsudin Budiansyah</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#F0FDF4;padding:0;padding-bottom:20px}
.header{background:linear-gradient(90deg,#16A34A,#F97316);color:#fff;padding:16px}
.header h2{font-size:20px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#fff;position:sticky;top:0;z-index:10}
.tabs button{white-space:nowrap;padding:10px 14px;border-radius:20px;border:1px solid #FDBA74;background:#fff;cursor:pointer;font-weight:bold;font-size:15px}
.tabs button.active{background:#16A34A;color:#fff;border-color:#16A34A}
.wrap{padding:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.kpi{background:#DCFCE7;padding:12px;border-radius:14px}.kpi b{font-size:15px;display:block}
.card{background:#fff;padding:12px;border-radius:14px;margin-top:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #ddd;margin-top:8px;outline:none;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.item{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.item .logo{width:100%;height:110px;display:flex;align-items:center;justify-content:center;font-size:64px;background:#F0FDF4}
.item .in{padding:9px}.item .in b{font-size:12px;display:block;min-height:28px}
.logo-preview{width:100%;height:90px;display:flex;align-items:center;justify-content:center;font-size:56px;background:#F0FDF4;border-radius:12px;margin-top:8px;border:2px dashed #16A34A}
.harga{color:#EA580C;font-weight:bold}
.stokbox{display:flex;justify-content:space-between;align-items:center;background:#F0FDF4;padding:4px 6px;border-radius:8px;font-size:12px;margin:6px 0}
.stokbox button{width:30px;height:30px;border-radius:50%;border:none;background:#16A34A;color:#fff;font-weight:bold;font-size:18px;cursor:pointer}
.btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:bold;margin-top:8px;cursor:pointer;font-size:15px}
.btn-orange{background:#EA580C;color:#fff}.btn-green{background:#16A34A;color:#fff}.btn-red{background:#DC2626;color:#fff}.btn-grey{background:#eee}.btn-blue{background:#2563EB;color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.hutang-item{background:#FFFBEB;border:1px solid #FDE68A;padding:10px;border-radius:12px;margin-top:10px}
label{font-size:13px;font-weight:bold;display:block;margin-top:10px}
.struk{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;padding:16px;z-index:99}
.struk .paper{background:#fff;width:100%;max-width:380px;padding:18px;border-radius:12px;max-height:90vh;overflow:auto}
.setup{position:fixed;top:0;left:0;right:0;bottom:0;background:#111;display:none;justify-content:center;align-items:center;padding:16px;z-index:200}
.setup .paper{background:#fff;width:100%;max-width:430px;padding:20px;border-radius:16px;max-height:92vh;overflow:auto}
.kartu{background:#FFFBEB;border:2px dashed #F59E0B;padding:12px;border-radius:12px;margin-top:10px}
.kartu b{font-size:13px}.kartu p{font-size:13px;margin:4px 0}
</style>
